# Databricks Asset Bundle — the accelerator's reproducible deploy.
# `databricks bundle deploy -t dev` provisions the 3 Lakebase instances + 4 apps
# (2 sellers, registry, buyer), then `databricks bundle run seed_job` seeds them
# (relational tables + kv_store).
#
# NOTE: skeleton — resource schemas are validated/refined on first `bundle deploy`.

bundle:
  name: iab_aamp_demo

variables:
  instance_prefix:
    description: Prefix for the 3 Lakebase instances (buyer/seller/registry).
    default: aamp

# Build the `seed` wheel locally at deploy time and upload it for the seed_job.
# We use `pip wheel` (not `python -m build`) on purpose: the repo's generated
# build/ render dir shadows the `build` module, which breaks `python -m build`.
# --no-build-isolation: build with the already-installed setuptools/wheel instead
# of fetching them per-build. The pure-python seed pkg needs no exotic build deps,
# and this keeps the deploy from depending on whatever index pip.conf points at
# (an internal proxy that intermittently can't serve setuptools>=68).
artifacts:
  seed_wheel:
    type: whl
    build: python3 -m pip wheel . --no-deps --no-build-isolation -w dist
    path: .

# The per-seller app source lives under build/ (generated by render_apps.py) which is
# .gitignored — and bundle file-sync respects .gitignore, so without this the app
# source_code_path would point at an unsynced (missing) workspace dir. Force-include it.
sync:
  include:
    - build/**

targets:
  dev:
    mode: development
    default: true
    # workspace.host comes from your `databricks auth` profile.
  # A second, independent stack (own terraform state — root_path includes the target
  # name), so it coexists with the dev target's deployment instead of replacing it.
  # Deploy with: make all PREFIX=aamp9 TARGET=aamp9 [PROFILE=name]
  aamp9:
    mode: development
    variables:
      instance_prefix: aamp9

resources:
  # --- Lakebase Autoscaling (Postgres) projects: buyer / seller / registry ---
  # Each project auto-creates a `production` branch + `primary` endpoint; we set the
  # endpoint to 0.5–1 CU with scale-to-zero (suspend after idle).
  postgres_projects:
    seller:
      project_id: ${var.instance_prefix}-seller
    buyer:
      project_id: ${var.instance_prefix}-buyer
    registry:
      project_id: ${var.instance_prefix}-registry
  # NOTE: we do NOT declare postgres_endpoints here. Creating a project auto-creates
  # its `production` branch + a `primary` read-write endpoint, and a branch may hold
  # only one read-write endpoint — so declaring `primary` again fails "already exists"
  # (the bundle can't adopt the auto-created endpoint into Terraform state). Instead
  # the auto-created endpoint is tuned to 0.5–1 CU + scale-to-zero (300s idle) as an
  # idempotent post-deploy step: `make endpoints` (run automatically by `make deploy`).

  # --- Databricks Apps ---
  # The seller-agent SDK is single-tenant (one publisher per app), so we deploy
  # ONE seller app PER seller from the SAME ./seller source. Each is UI + REST + MCP
  # in one process; AAMP_SELLER selects its catalog (kv_<slug>) + pricing partition.
  # Set AAMP_SELLER per app (seller/app.yaml defaults to summit; override for beacon
  # via the app's env at deploy — see seller/README.md). ✅ seller component built.
  # ONE app PER seller (each its own MCP server). Databricks Apps need a unique
  # source_code_path per app, so the per-seller dirs are generated from ./seller by
  # `python seller/render_apps.py ${var.instance_prefix}` — run via `make deploy`
  # (which renders then `databricks bundle deploy`). The `database` resource grants
  # each app's service principal a Postgres role on the seller Lakebase instance.
  # No app→Lakebase resource binding. The Provisioned `database` binding 404s on an
  # Autoscaling project; the Autoscaling `postgres` binding needs the target database
  # pre-REGISTERED with a stable id before this deploy reaches the app — but there is no
  # `postgres_database` bundle resource to order that on, so it forces a two-phase deploy.
  # Instead each app mints its own OAuth token via w.postgres (db.py) and its service
  # principal is granted by `make grant-apps` (registers the SP as a Postgres role —
  # the seed→app handshake), backed by the seed's GRANT ... TO PUBLIC. One clean deploy.
  apps:
    seller_summit_app:
      name: ${var.instance_prefix}-seller-summit
      source_code_path: ./build/seller-summit
    seller_beacon_app:
      name: ${var.instance_prefix}-seller-beacon
      source_code_path: ./build/seller-beacon
    # The registry (REST + MCP over the SDK's AgentRegistryService). Same shape as the
    # sellers: stateless, w.postgres, SP granted by `make grant-apps`. Rendered from
    # ./registry by `python registry/render_apps.py ${var.instance_prefix}`.
    registry_app:
      name: ${var.instance_prefix}-registry-app
      source_code_path: ./build/registry
    # The agentic buyer (UI + REST + L1/L2/L3 CrewAI flow). Rendered from ./buyer by
    # `python buyer/render_apps.py ${var.instance_prefix}` (copies source + taxonomy TSVs
    # + stamps the buyer/registry instance env). Its SP is granted on the buyer AND
    # registry Lakebase + CAN_QUERY on the Model Serving endpoint(s) (e.g.
    # databricks-claude-sonnet-4-5) by `make grant-apps`, and CAN_USE on the registry +
    # seller apps by `make grant-app-access`. Sellers are discovered via the registry
    # (no AAMP_SELLER_URLS wiring); the presented identity tier is chosen per-run in the UI.
    buyer_app:
      name: ${var.instance_prefix}-buyer-app
      source_code_path: ./build/buyer

  # --- Seed job: generate + validate + load relational tables + kv_store ---
  jobs:
    seed_job:
      name: ${var.instance_prefix}-seed
      tasks:
        - task_key: seed
          environment_key: default
          python_wheel_task:
            package_name: seed
            # entry_point = the console-script name in pyproject ([project.scripts] seed=...).
            entry_point: seed
            # `seed` subcommand + the prefix the bundle deployed, so the job seeds the
            # SAME Lakebase instances (not config.yaml's default "aamp").
            parameters: ["seed", "--prefix", "${var.instance_prefix}"]
      environments:
        - environment_key: default
          spec:
            client: "2"
            # "." is the seed wheel (built from this repo, pyyaml base dep). The DB
            # extras can't ride as ".[db]" (the bundle globs that as a path), so the
            # seed's optional deps are listed explicitly. No SDK (ad_seller) needed —
            # materialize_kv uses raw psycopg.
            dependencies:
              - ./dist/*.whl
              - "psycopg[binary]>=3.1"
              - "databricks-sdk>=0.119.0"   # >=0.119 for the Autoscaling w.postgres API (provision.py)
